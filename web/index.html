<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ===== SEO base (se refina en runtime con los datos del gimnasio) ===== -->
    <title>Training Loja · Gimnasio y entrenamiento funcional</title>
    <meta
      name="description"
      content="Gimnasio con planes, clases y entrenadores profesionales. Sumate y transforma tu entrenamiento con nosotros."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="/" />

    <!-- Open Graph (vista previa al compartir por WhatsApp / Facebook) -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:site_name" content="Training Loja" />
    <meta property="og:title" content="Training Loja · Gimnasio y entrenamiento funcional" />
    <meta
      property="og:description"
      content="Gimnasio con planes, clases y entrenadores profesionales. Sumate y transforma tu entrenamiento."
    />
    <meta property="og:image" content="/site/inicio-1.jpg" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Training Loja · Gimnasio y entrenamiento funcional" />
    <meta
      name="twitter:description"
      content="Gimnasio con planes, clases y entrenadores profesionales. Sumate y transforma tu entrenamiento."
    />
    <meta name="twitter:image" content="/site/inicio-1.jpg" />

    <!-- Fuentes de la web publica (titulos condensados + etiquetas mono) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anybody:ital,wght@0,700;0,800;0,900;1,700;1,800;1,900&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Favicon (pestana del navegador) -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />

    <!-- PWA: instalable en Android e iOS -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#080b12" />

    <!-- iOS (Safari): "Anadir a pantalla de inicio" -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Training Loja" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
